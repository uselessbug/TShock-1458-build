name: Build TShock 1.4.5.8 ARM64 Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-linux-arm64-image:
    runs-on: ubuntu-latest

    env:
      TSHOCK_SHA: 8dfbab5ddab77fc53e66780612f4849b555a58aa
      TSAPI_SHA: e6f3b40a2cb0d1f3dcc2acbfd1ebff815bade9ce
      IMAGE: ghcr.io/uselessbug/tshock-1458-build

    steps:
      - name: Checkout pinned TShock PR build
        uses: actions/checkout@v4
        with:
          repository: Pryaxis/TShock
          ref: 8dfbab5ddab77fc53e66780612f4849b555a58aa
          submodules: recursive
          fetch-depth: 0

      - name: Replace TerrariaServerAPI with pinned TSAPI PR build
        shell: bash
        run: |
          set -euxo pipefail
          git -C TerrariaServerAPI fetch origin refs/pull/283/head
          git -C TerrariaServerAPI checkout --detach "$TSAPI_SHA"

          test "$(git rev-parse HEAD)" = "$TSHOCK_SHA"
          test "$(git -C TerrariaServerAPI rev-parse HEAD)" = "$TSAPI_SHA"

          echo "TShock: $(git rev-parse HEAD)"
          echo "TSAPI:  $(git -C TerrariaServerAPI rev-parse HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/uselessbug/tshock-1458-build:1.4.5.8-arm64
            ghcr.io/uselessbug/tshock-1458-build:pr3301-pr283
            ghcr.io/uselessbug/tshock-1458-build:latest
          labels: |
            org.opencontainers.image.title=TShock 1.4.5.8 unofficial ARM64 build
            org.opencontainers.image.description=Pryaxis/TShock PR 3301 + Pryaxis/TSAPI PR 283
            org.opencontainers.image.source=https://github.com/uselessbug/TShock-1458-build
            org.opencontainers.image.revision=8dfbab5ddab77fc53e66780612f4849b555a58aa
          cache-from: type=gha,scope=tshock-1458-arm64
          cache-to: type=gha,mode=max,scope=tshock-1458-arm64

      - name: Show image digest
        shell: bash
        run: |
          echo "Image: $IMAGE"
          echo "Digest: ${{ steps.docker.outputs.digest }}"
